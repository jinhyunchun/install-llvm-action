name: Scheduled Generate

on:
  schedule:
    - cron: '0 0 * * 0' # Runs every Sunday at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-assets-${{ github.ref }}

jobs:
  generate:
    runs-on: ubuntu-latest

    outputs:
      changed: ${{ steps.git-check.outputs.changed }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Latest 24.x; check-latest avoids a stale runner-cached patch release.
          node-version: '24'
          check-latest: true

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Run Generate
        run: npm run generate
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check for Changes
        id: git-check
        run: |
          if [[ -n "$(git status --porcelain -- assets.json)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Generated Assets
        if: steps.git-check.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: generated-assets
          path: assets.json
          if-no-files-found: error

  test:
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    uses: ./.github/workflows/test.yml
    with:
      assets-artifact: generated-assets

  push:
    needs: [generate, test]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download Generated Assets
        uses: actions/download-artifact@v8
        with:
          name: generated-assets

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update generated files" -- assets.json
          git push origin "HEAD:${GITHUB_REF_NAME}"
