# yaml-language-server: $schema=https://json-schema.org/draft-07/schema#

name: Test

on:
  pull_request:
  push:
    branches:
      - master
  workflow_call:
    inputs:
      artifact:
        description: Name of an artifact to extract over the checkout before testing (e.g. a regenerated assets.json or a rebuilt dist).
        type: string
        required: false
      artifact-path:
        description: Directory to extract the artifact into.
        type: string
        required: false
        default: .

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-26
          - windows-latest
        version:
          - 17
          - 17.0.2

    runs-on: "${{ matrix.os }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download artifact
        if: inputs.artifact
        uses: actions/download-artifact@v8
        with:
          name: "${{ inputs.artifact }}"
          path: "${{ inputs.artifact-path }}"

      - name: Arch (Ubuntu / macOS)
        if: matrix.os != 'windows-latest'
        run: uname -a

      - name: Arch (Windows)
        if: matrix.os == 'windows-latest'
        run: printenv PROCESSOR_ARCHITECTURE

      - name: Install LLVM and Clang
        uses: ./
        with:
          version: "${{ matrix.version }}"
          env: true

      - name: Test (Ubuntu / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          echo $CC
          echo $CXX
          $CC --version
          $CXX --version

      - name: Test (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          echo $env:CC
          echo $env:CXX
          clang --version
          clang++ --version
